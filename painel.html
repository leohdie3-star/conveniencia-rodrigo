<style>

:root{

.btn.small{padding:5px 11px;min-height:32px;font-size:12.5px;border-radius:9px}

.col-head{display:flex;align-items:center;gap:8px;padding:13px 15px;border-bottom:1px solid var(--hair-soft);box-shadow:inset 0 2px 0 var(--col-accent);border-radius:var(--radius) var(--radius) 0 0;margin-bottom:11px}
.col-head .n{margin-left:auto;font-weight:700;color:var(--faint);font-size:12px;background:rgba(255,255,255,.05);border:1px solid var(--hair-soft);border-radius:12px;padding:0 8px}
.col-body{padding:0 11px}
.pcard{background:linear-gradient(155deg,rgba(255,255,255,.075),rgba(255,255,255,.028));border:1px solid var(--hair);border-left:3px solid var(--col-accent,#f08a2e);border-radius:14px;padding:13px;margin:0 0 10px;box-shadow:var(--shadow-sm),inset 0 1px 0 rgba(255,255,255,.06);cursor:grab;transition:transform .17s var(--ease),box-shadow .17s var(--ease),border-color .17s var(--ease)}
.pcard:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.17);box-shadow:var(--shadow-md),inset 0 1px 0 rgba(255,255,255,.08)}
.pcard:active{cursor:grabbing}
.pcard .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pcard .cli{font-weight:700;font-size:13.5px;letter-spacing:-.01em}
.pcard .hora{margin-left:auto;font-size:11.5px;color:var(--faint)}
.pcard .itens{font-size:12.5px;color:var(--muted);white-space:pre-line;line-height:1.5}
.pcard .meta{font-size:11.5px;color:var(--faint);margin-top:7px}
.pcard .acts{display:flex;gap:5px;margin-top:11px;flex-wrap:wrap}
.mini-btn{font-size:12px;font-weight:600;padding:0 9px;min-height:28px;border-radius:8px;background:rgba(255,255,255,.045);border:1px solid var(--hair);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;transition:color .15s var(--ease),border-color .15s var(--ease),background .15s var(--ease),transform .15s var(--ease)}

.table-wrap{overflow-x:auto}

<body>
<div class="demo-strip">Ambiente de demonstração — dados fictícios · nada aqui é real</div>
<div class="layout">
  <aside class="sidebar">
    <div class="side-brand">
      <div class="side-mark">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16l-1.3 9.1a2.4 2.4 0 0 1-2.4 2.1H7.7a2.4 2.4 0 0 1-2.4-2.1L4 9Z"/><path d="M8.5 9V7a3.5 3.5 0 0 1 7 0v2"/></svg>
      </div>
      <div><b>Conveniência<br>do Rodrigo</b><span>Painel de gestão</span></div>
    </div>
    <button class="tab" data-view="visao" aria-selected="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></svg>
      Visão geral
    </button>
    <button class="tab" data-view="pedidos" aria-selected="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-2-1.5L14 21l-2-1.5L10 21l-2-1.5L6 21V3Z"/><path d="M9 8h6M9 12h6"/></svg>
      Pedidos
    </button>
    <button class="tab" data-view="estoque" aria-selected="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg>
      Itens &amp; estoque
    </button>
    <div class="sidebar-foot">
      Tudo o que você fizer aqui fica salvo neste navegador.
      <button class="btn-reset" id="btnReset">Restaurar demonstração</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<!-- Modal genérico -->
<div class="modal-veil" id="modalVeil">
  <div class="modal" role="dialog" aria-modal="true">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div class="modal-acts">
      <button class="btn ghosty" id="modalCancel">Cancelar</button>
      <button class="btn" id="modalSave">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
var LS_KEY = 'rodrigoPainelV1';
var ETAPAS = ['novo','preparando','pronto','concluido'];
var ETAPA_LABEL = {novo:'Novo', preparando:'Preparando', pronto:'Pronto', concluido:'Concluído'};
var CATS = ['Bebidas','Snacks','Doces','Última hora','Gelados & mais'];

function seed(){
  var hoje = new Date(); hoje.setHours(0,0,0,0);
  function t(h,m){ var d = new Date(hoje); d.setHours(h,m,0,0); return d.getTime(); }
  return {
    itens: [
      {id:'i1', nome:'Refrigerante lata', cat:'Bebidas', qtd:48, min:12},
      {id:'i2', nome:'Água mineral 500 ml', cat:'Bebidas', qtd:60, min:20},
      {id:'i3', nome:'Cerveja lata', cat:'Bebidas', qtd:36, min:12},
      {id:'i4', nome:'Energético lata', cat:'Bebidas', qtd:8, min:10},
      {id:'i5', nome:'Salgadinho pacote', cat:'Snacks', qtd:25, min:8},
      {id:'i6', nome:'Chocolate em barra', cat:'Doces', qtd:18, min:6},
      {id:'i7', nome:'Pilha AA (par)', cat:'Última hora', qtd:4, min:6},
      {id:'i8', nome:'Gelo em cubos (saco 3 kg)', cat:'Gelados & mais', qtd:15, min:5},
      {id:'i9', nome:'Pão de forma', cat:'Gelados & mais', qtd:10, min:4}
    ],
    pedidos: [
      {id:'p1', cliente:'Maria Clara', tel:'', forma:'retirada', status:'novo', criado:t(9,12),
       itens:[{nome:'Refrigerante lata', q:2},{nome:'Salgadinho pacote', q:1}], obs:'Retira no balcão'},
      {id:'p2', cliente:'João Pedro', tel:'', forma:'entrega', status:'preparando', criado:t(10,5),
       itens:[{nome:'Cerveja lata', q:6},{nome:'Gelo em cubos (saco 3 kg)', q:1}], obs:'Endereço confirmado no WhatsApp'},
      {id:'p3', cliente:'Ana Beatriz', tel:'', forma:'retirada', status:'pronto', criado:t(10,40),
       itens:[{nome:'Água mineral 500 ml', q:4},{nome:'Chocolate em barra', q:2}], obs:''},
      {id:'p4', cliente:'Carlos', tel:'', forma:'entrega', status:'concluido', criado:t(8,15),
       itens:[{nome:'Pão de forma', q:1},{nome:'Energético lata', q:2}], obs:''}
    ]
  };
}
function load(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(raw){ var s = JSON.parse(raw); if(s && s.itens && s.pedidos) return s; }
  }catch(e){}
  var s = seed(); save(s); return s;
}
function save(s){ try{ localStorage.setItem(LS_KEY, JSON.stringify(s)); }catch(e){} }
var state = load();
var view = 'visao';

function uid(p){ return p + Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function horaDe(ts){ var d = new Date(ts); return ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2); }
function ehHoje(ts){ var d = new Date(ts), n = new Date(); return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate(); }
function itensTexto(p){ return p.itens.map(function(i){ return i.q + 'x ' + i.nome; }).join('\n'); }
function totalItensPedido(p){ return p.itens.reduce(function(a,i){ return a + (+i.q || 0); }, 0); }
function alertasEstoque(){ return state.itens.filter(function(i){ return i.qtd <= i.min; }); }

var toastTimer = null;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1900);
}

/* ---------- Navegação ---------- */
var tabs = document.querySelectorAll('.tab');
tabs.forEach(function(b){
  b.addEventListener('click', function(){ ir(b.getAttribute('data-view')); });
});
function ir(v){
  view = v;
  tabs.forEach(function(b){ b.setAttribute('aria-selected', b.getAttribute('data-view') === v ? 'true' : 'false'); });
  render();
}
window.A = { ir: ir };

function head(titulo, desc, acoes){
  return '<div class="view-head"><div><h1>' + titulo + '</h1><p>' + desc + '</p></div><div class="head-actions">' + (acoes || '') + '</div></div>';
}

/* ---------- Views ---------- */
function render(){
  var main = document.getElementById('main');
  if(view === 'visao') main.innerHTML = vVisao();
  else if(view === 'pedidos'){ main.innerHTML = vPedidos(); ligarDnD(); }
  else if(view === 'estoque') main.innerHTML = vEstoque();
}

function vVisao(){
  var hoje = state.pedidos.filter(function(p){ return ehHoje(p.criado); });
  var abertos = state.pedidos.filter(function(p){ return p.status !== 'concluido'; });
  var conc = state.pedidos.filter(function(p){ return p.status === 'concluido'; });
  var alertas = alertasEstoque();
  var kpis = '<div class="kpis">' +
    '<div class="kpi"><div class="label">Pedidos de hoje</div><div class="value">' + hoje.length + '</div><div class="sub">' + hoje.filter(function(p){ return p.status !== 'concluido'; }).length + ' ainda em andamento</div></div>' +
    '<div class="kpi"><div class="label">Em aberto agora</div><div class="value">' + abertos.length + '</div><div class="sub">em todas as etapas</div></div>' +
    '<div class="kpi"><div class="label">Concluídos (total)</div><div class="value">' + conc.length + '</div><div class="sub">pedidos finalizados</div></div>' +
    '<div class="kpi' + (alertas.length ? ' warn-kpi' : '') + '"><div class="label">Itens em alerta</div><div class="value">' + alertas.length + '</div><div class="sub">' + (alertas.length ? 'estoque no mínimo ou abaixo' : 'estoque abastecido') + '</div></div>' +
  '</div>';
  var recentes = state.pedidos.slice().sort(function(a,b){ return b.criado - a.criado; }).slice(0,5);
  var rec = recentes.length ? recentes.map(function(p){
    return '<div class="mini-row"><div class="grow"><b>' + esc(p.cliente) + '</b><small>' + totalItensPedido(p) + ' itens · ' + (p.forma === 'entrega' ? 'entrega' : 'retirada') + ' · ' + horaDe(p.criado) + '</small></div><span class="badge ' + p.status + '">' + ETAPA_LABEL[p.status] + '</span></div>';
  }).join('') : '<p class="empty-note">Nenhum pedido ainda.</p>';
  var baixo = alertas.length ? alertas.map(function(i){
    return '<div class="mini-row"><div class="grow"><b>' + esc(i.nome) + '</b><small>' + esc(i.cat) + '</small></div><span class="badge baixo">' + i.qtd + ' un · mín. ' + i.min + '</span></div>';
  }).join('') : '<p class="empty-note">Estoque abastecido — nenhum item no mínimo.</p>';
  return head('Visão geral', 'O dia da loja num relance: pedidos, andamento e estoque.') + kpis +
    '<div class="grid-2">' +
      '<div class="card"><h2>Pedidos recentes <button class="link" onclick="A.ir(\'pedidos\')">ver quadro</button></h2>' + rec + '</div>' +
      '<div class="card"><h2>Estoque baixo <button class="link" onclick="A.ir(\'estoque\')">ver itens</button></h2>' + baixo + '</div>' +
    '</div>';
}

function cardPedido(p){
  var idx = ETAPAS.indexOf(p.status);
  var prox = idx < ETAPAS.length - 1 ? ETAPAS[idx + 1] : null;
  var ant = idx > 0 ? ETAPAS[idx - 1] : null;
  return '<article class="pcard" draggable="true" data-pid="' + p.id + '">' +
    '<div class="top"><span class="cli">' + esc(p.cliente) + '</span><span class="hora">' + horaDe(p.criado) + '</span></div>' +
    '<div class="itens">' + esc(itensTexto(p)) + '</div>' +
    '<div class="meta">' + (p.forma === 'entrega' ? 'Entrega' : 'Retirada na loja') + (p.obs ? ' · ' + esc(p.obs) : '') + '</div>' +
    '<div class="acts">' +
      (ant ? '<button class="mini-btn" data-move="' + p.id + ':' + ant + '">← ' + ETAPA_LABEL[ant] + '</button>' : '') +
      (prox ? '<button class="mini-btn go" data-move="' + p.id + ':' + prox + '">' + ETAPA_LABEL[prox] + ' →</button>' : '') +
      '<button class="mini-btn" data-edit-pedido="' + p.id + '">Editar</button>' +
      '<button class="mini-btn del" data-del-pedido="' + p.id + '">Excluir</button>' +
    '</div></article>';
}
function vPedidos(){
  var cols = ETAPAS.map(function(et){
    var ps = state.pedidos.filter(function(p){ return p.status === et; })
      .sort(function(a,b){ return a.criado - b.criado; });
    var cards = ps.length ? ps.map(cardPedido).join('') : '<div class="col-empty">Nenhum pedido aqui</div>';
    return '<section class="col" data-col="' + et + '"><div class="col-head"><span class="badge ' + et + '">' + ETAPA_LABEL[et] + '</span><span class="n">' + ps.length + '</span></div><div class="col-body" data-etapa="' + et + '">' + cards + '</div></section>';
  }).join('');
  return head('Pedidos', 'Arraste os cartões entre as etapas ou use os botões de cada pedido.',
    '<button class="btn" id="btnNovoPedido">+ Novo pedido</button>') +
    '<div class="board">' + cols + '</div>';
}
function ligarDnD(){
  var dragId = null;
  document.querySelectorAll('.pcard').forEach(function(c){
    c.addEventListener('dragstart', function(e){ dragId = c.getAttribute('data-pid'); e.dataTransfer.effectAllowed = 'move'; try{ e.dataTransfer.setData('text/plain', dragId); }catch(err){} });
  });
  document.querySelectorAll('.col').forEach(function(col){
    col.addEventListener('dragover', function(e){ e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', function(){ col.classList.remove('drag-over'); });
    col.addEventListener('drop', function(e){
      e.preventDefault(); col.classList.remove('drag-over');
      var id = dragId || (e.dataTransfer ? e.dataTransfer.getData('text/plain') : null);
      if(id) moverPedido(id, col.getAttribute('data-col'));
    });
  });
  var novo = document.getElementById('btnNovoPedido');
  if(novo) novo.addEventListener('click', function(){ abrirPedido(null); });
}

function vEstoque(){
  var rows = state.itens.map(function(i){
    var baixo = i.qtd <= i.min;
    return '<tr><td><b>' + esc(i.nome) + '</b></td><td>' + esc(i.cat) + '</td><td>' + i.qtd + '</td><td>' + i.min + '</td>' +
      '<td><span class="badge ' + (baixo ? 'baixo' : 'okb') + '">' + (baixo ? 'Repor' : 'OK') + '</span></td>' +
      '<td style="white-space:nowrap"><button class="mini-btn" data-edit-item="' + i.id + '">Editar</button> <button class="mini-btn del" data-del-item="' + i.id + '">Excluir</button></td></tr>';
  }).join('');
  return head('Itens & estoque', 'Controle simples do que tem na loja. Itens no mínimo aparecem em alerta.',
    '<button class="btn" id="btnNovoItem">+ Novo item</button>') +
    '<div class="card"><div class="table-wrap"><table><thead><tr><th>Item</th><th>Categoria</th><th>Quantidade</th><th>Mínimo</th><th>Situação</th><th></th></tr></thead><tbody>' + rows + '</tbody></div></div>';
}

/* ---------- Ações globais (delegação) ---------- */
document.getElementById('main').addEventListener('click', function(e){
  var mv = e.target.closest('[data-move]');
  if(mv){ var parts = mv.getAttribute('data-move').split(':'); moverPedido(parts[0], parts[1]); return; }
  var ep = e.target.closest('[data-edit-pedido]');
  if(ep){ abrirPedido(ep.getAttribute('data-edit-pedido')); return; }
  var dp = e.target.closest('[data-del-pedido]');
  if(dp){ excluirPedido(dp.getAttribute('data-del-pedido')); return; }
  var ei = e.target.closest('[data-edit-item]');
  if(ei){ abrirItem(ei.getAttribute('data-edit-item')); return; }
  var di = e.target.closest('[data-del-item]');
  if(di){ excluirItem(di.getAttribute('data-del-item')); return; }
  if(e.target.id === 'btnNovoItem'){ abrirItem(null); }
});
function moverPedido(id, etapa){
  var p = state.pedidos.filter(function(x){ return x.id === id; })[0];
  if(!p || p.status === etapa) return;
  p.status = etapa; save(state); render(); ligarDnDSeguro();
  toast('Pedido de ' + p.cliente + ' → ' + ETAPA_LABEL[etapa]);
}
function ligarDnDSeguro(){ if(view === 'pedidos') ligarDnD(); }
function excluirPedido(id){
  var p = state.pedidos.filter(function(x){ return x.id === id; })[0];
  if(!p) return;
  if(!confirm('Excluir o pedido de ' + p.cliente + '?')) return;
  state.pedidos = state.pedidos.filter(function(x){ return x.id !== id; });
  save(state); render(); ligarDnDSeguro(); toast('Pedido excluído');
}
function excluirItem(id){
  var i = state.itens.filter(function(x){ return x.id === id; })[0];
  if(!i) return;
  if(!confirm('Excluir o item "' + i.nome + '"?')) return;
  state.itens = state.itens.filter(function(x){ return x.id !== id; });
  save(state); render(); toast('Item excluído');
}

/* ---------- Modal ---------- */
var veil = document.getElementById('modalVeil');
var onSave = null;
function abrirModal(titulo, corpo, salvar){
  document.getElementById('modalTitle').textContent = titulo;
  document.getElementById('modalBody').innerHTML = corpo;
  onSave = salvar;
  veil.classList.add('open');
}
function fecharModal(){ veil.classList.remove('open'); onSave = null; }
document.getElementById('modalCancel').addEventListener('click', fecharModal);
veil.addEventListener('click', function(e){ if(e.target === veil) fecharModal(); });
document.getElementById('modalSave').addEventListener('click', function(){ if(onSave) onSave(); });

function opcoesItens(sel){
  return state.itens.map(function(i){
    return '<option value="' + esc(i.nome) + '"' + (i.nome === sel ? ' selected' : '') + '>' + esc(i.nome) + '</option>';
  }).join('');
}
function linhaItemPedido(nome, q){
  return '<div class="item-line"><select class="li-nome">' + opcoesItens(nome || '') + '</select>' +
    '<input type="number" class="li-qtd" min="1" value="' + (q || 1) + '" aria-label="Quantidade">' +
    '<button class="rm" type="button" aria-label="Remover item">✕</button></div>';
}
function abrirPedido(id){
  var p = id ? state.pedidos.filter(function(x){ return x.id === id; })[0] : null;
  var linhas = p && p.itens.length ? p.itens.map(function(i){ return linhaItemPedido(i.nome, i.q); }).join('') : linhaItemPedido('', 1);
  var corpo =
    '<div class="f-field"><label for="mp-cliente">Nome do cliente</label><input id="mp-cliente" type="text" value="' + (p ? esc(p.cliente) : '') + '" placeholder="Ex.: Maria Clara"></div>' +
    '<div class="f-row">' +
      '<div class="f-field"><label for="mp-forma">Recebimento</label><select id="mp-forma"><option value="retirada"' + (p && p.forma === 'retirada' ? ' selected' : '') + '>Retirada na loja</option><option value="entrega"' + (p && p.forma === 'entrega' ? ' selected' : '') + '>Entrega</option></select></div>' +
      '<div class="f-field"><label for="mp-status">Etapa</label><select id="mp-status">' + ETAPAS.map(function(et){ return '<option value="' + et + '"' + (p && p.status === et ? ' selected' : '') + '>' + ETAPA_LABEL[et] + '</option>'; }).join('') + '</select></div>' +
    '</div>' +
    '<div class="f-field"><label>Itens do pedido</label><div id="mp-itens">' + linhas + '</div><button class="link-add" type="button" id="mp-add-item">+ adicionar item</button></div>' +
    '<div class="f-field"><label for="mp-obs">Observação</label><textarea id="mp-obs" rows="2" placeholder="Ex.: endereço, troco, horário">' + (p ? esc(p.obs) : '') + '</textarea></div>';
  abrirModal(p ? 'Editar pedido' : 'Novo pedido', corpo, function(){
    var cliente = document.getElementById('mp-cliente').value.trim();
    if(!cliente){ alert('Informe o nome do cliente.'); return; }
    var itens = [];
    document.querySelectorAll('#mp-itens .item-line').forEach(function(l){
      var nome = l.querySelector('.li-nome').value;
      var q = parseInt(l.querySelector('.li-qtd').value, 10) || 0;
      if(nome && q > 0) itens.push({nome: nome, q: q});
    });
    if(!itens.length){ alert('Adicione pelo menos um item.'); return; }
    var dados = {
      cliente: cliente,
      forma: document.getElementById('mp-forma').value,
      status: document.getElementById('mp-status').value,
      obs: document.getElementById('mp-obs').value.trim(),
      itens: itens
    };
    if(p){ for(var k in dados) p[k] = dados[k]; }
    else { dados.id = uid('p'); dados.tel = ''; dados.criado = Date.now(); state.pedidos.push(dados); }
    save(state); fecharModal(); render(); ligarDnDSeguro(); toast(p ? 'Pedido atualizado' : 'Pedido criado');
  });
  document.getElementById('mp-add-item').addEventListener('click', function(){
    var box = document.getElementById('mp-itens');
    var div = document.createElement('div');
    div.innerHTML = linhaItemPedido('', 1);
    box.appendChild(div.firstChild);
    ligarRemocaoItens();
  });
  ligarRemocaoItens();
}
function ligarRemocaoItens(){
  document.querySelectorAll('#mp-itens .rm').forEach(function(b){
    b.onclick = function(){
      var box = document.getElementById('mp-itens');
      if(box.children.length > 1) b.closest('.item-line').remove();
    };
  });
}
function abrirItem(id){
  var i = id ? state.itens.filter(function(x){ return x.id === id; })[0] : null;
  var corpo =
    '<div class="f-field"><label for="mi-nome">Nome do item</label><input id="mi-nome" type="text" value="' + (i ? esc(i.nome) : '') + '" placeholder="Ex.: Refrigerante lata"></div>' +
    '<div class="f-field"><label for="mi-cat">Categoria</label><select id="mi-cat">' + CATS.map(function(c){ return '<option' + (i && i.cat === c ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select></div>' +
    '<div class="f-row">' +
      '<div class="f-field"><label for="mi-qtd">Quantidade em estoque</label><input id="mi-qtd" type="number" min="0" value="' + (i ? i.qtd : 0) + '"></div>' +
      '<div class="f-field"><label for="mi-min">Mínimo (alerta)</label><input id="mi-min" type="number" min="0" value="' + (i ? i.min : 5) + '"></div>' +
    '</div>';
  abrirModal(i ? 'Editar item' : 'Novo item', corpo, function(){
    var nome = document.getElementById('mi-nome').value.trim();
    if(!nome){ alert('Informe o nome do item.'); return; }
    var dados = {
      nome: nome,
      cat: document.getElementById('mi-cat').value,
      qtd: parseInt(document.getElementById('mi-qtd').value, 10) || 0,
      min: parseInt(document.getElementById('mi-min').value, 10) || 0
    };
    if(i){ for(var k in dados) i[k] = dados[k]; }
    else { dados.id = uid('i'); state.itens.push(dados); }
    save(state); fecharModal(); render(); toast(i ? 'Item atualizado' : 'Item criado');
  });
}

document.getElementById('btnReset').addEventListener('click', function(){
  if(!confirm('Voltar aos dados de exemplo da demonstração? Suas alterações serão apagadas.')) return;
  state = seed(); save(state); ir('visao'); toast('Demonstração restaurada');
});

render();
})();
</script>
</body>
</html>
